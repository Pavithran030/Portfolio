name: Update GitHub data
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch contribution calendar
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USER: Pavithran030
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/github.json src/data/github.json
          git diff --staged --quiet || (git commit -m "chore: update GitHub contribution data [skip ci]" && git push)
